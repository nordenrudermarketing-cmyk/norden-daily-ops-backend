<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>路得行旅 每日營運系統</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-screen">
    <div class="login-box">
      <h1>路得行旅</h1>
      <p>每日營運系統・請輸入登入代碼與密碼</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginCode">登入代碼</label>
          <input type="text" id="loginCode" name="username" inputmode="numeric" placeholder="輸入代碼" autocomplete="username">
        </div>
        <div class="field">
          <label for="passwordInput">密碼</label>
          <input type="password" id="passwordInput" name="password" placeholder="輸入密碼" autocomplete="current-password">
        </div>
        <button class="primary" type="submit" id="loginBtn">登入</button>
      </form>

      <p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px;">
        第一次登入的同仁：輸入登入代碼後，這次輸入的密碼就會成為你的新密碼，之後每次都用這組密碼登入。
      </p>
      <p class="error-msg" id="errorMsg"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
<script src="sidebar.js"></script></body>
</html>
