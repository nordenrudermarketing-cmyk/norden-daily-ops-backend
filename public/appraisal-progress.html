<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>評分進度 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 860px; }
  .banner { background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .warn-box { background: #fff6e0; color: #8a6d00; border-radius: 12px; padding: 10px 14px; font-size: 12.5px; line-height: 1.7; margin-bottom: 10px; }
  .sec-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 18px 0 8px; }
  .row { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
  .row .who { flex: 1; min-width: 0; }
  .row .name { font-size: 14px; font-weight: 500; }
  .row .meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.6; }
  .row .num { font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  .st { font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .st.done { background: var(--accent-soft); color: var(--accent); }
  .st.todo { background: var(--danger-soft); color: var(--danger); }
  .st.opt { background: #efece5; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>評分進度</h1>
        <p id="staffLine">—</p>
      </div>
    </div>
    <div id="banner"></div>
    <div id="warnings"></div>
    <p class="error-msg" id="statusLine" style="min-height:0;"></p>
    <div id="list"><p class="empty-state">載入中…</p></div>
  </div>

  <script src="config.js"></script>
  <script src="appraisal-progress.js"></script>
<script src="sidebar.js"></script></body>
</html>
