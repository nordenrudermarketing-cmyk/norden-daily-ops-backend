<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匯入排班表 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  .wide-screen { max-width: 100%; padding: 20px; }
  .top-controls { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .top-controls .field { margin-bottom: 0; }
  .warn-box { background: var(--danger-soft); border: 1px solid #e3bfae; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--danger); }
  .ok-box { background: var(--accent-soft); border: 1px solid #b9d3c5; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--accent); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; }
  table.preview { border-collapse: collapse; font-size: 11.5px; white-space: nowrap; }
  table.preview th, table.preview td { border: 1px solid var(--line); padding: 3px 5px; text-align: center; }
  table.preview th.name-col, table.preview td.name-col { position: sticky; left: 0; background: var(--surface); z-index: 2; text-align: left; padding-left: 8px; min-width: 90px; }
  table.preview th { background: var(--accent-soft); font-weight: 500; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>匯入排班表 Excel</h1>
        <p>上傳現有的班表檔案，系統會自動解析，確認無誤後才會真的寫入</p>
      </div>
      <a class="logout-link" href="schedule.html">回排班表</a>
    </div>

    <div class="top-controls">
      <div class="field"><label for="fileInput">選擇 Excel 檔案</label><input type="file" id="fileInput" accept=".xlsx,.xls"></div>
      <div class="field"><label for="monthInput">這份班表是哪個月份</label><input type="month" id="monthInput"></div>
    </div>

    <p style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">
      系統會抓表格裡「1、2、3...」這樣的日期橫列當欄位，並用姓名去比對系統裡的同仁——
      比對不到的姓名（可能是打字不同、或是已離職同仁）會列在下面的警示區，不會被匯入，
      需要的話你可以自己手動在排班表頁面補上。
    </p>

    <div id="resultArea"></div>
  </div>

  <script src="config.js"></script>
  <script src="schedule-import.js"></script>
</body>
</html>
