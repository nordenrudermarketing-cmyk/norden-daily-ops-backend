<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異常處理 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 820px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .filter-row select { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .trend-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .trend-card.high { border-color: #e3bfae; background: var(--danger-soft); }
  .trend-count { font-size: 20px; font-weight: 600; color: var(--danger); }
  .trend-item { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>異常處理</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="dashboard.html">回總覽</a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="list">處理清單</button>
      <button class="tab-btn" data-tab="trend">房間重複問題</button>
    </div>

    <div id="listTab">
      <div class="filter-row">
        <select id="resolvedFilter">
          <option value="false">待處理</option>
          <option value="true">已處理</option>
          <option value="">全部</option>
        </select>
        <select id="sourceFilter">
          <option value="">全部來源</option>
          <option value="room">客房</option>
          <option value="shift_task">客務班別任務</option>
          <option value="public_area">公共空間</option>
          <option value="deep_clean">細清</option>
        </select>
      </div>
      <div id="issueList"></div>
    </div>

    <div id="trendTab" style="display:none;">
      <div class="filter-row">
        <select id="daysFilter">
          <option value="14">近14天</option>
          <option value="30" selected>近30天</option>
          <option value="90">近90天</option>
        </select>
      </div>
      <div id="trendList"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="issues.js"></script>
<script src="sidebar.js"></script></body>
</html>
