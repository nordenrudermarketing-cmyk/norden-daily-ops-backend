<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待辦事項 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 820px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px; font-size: 14px; color: var(--ink-soft); cursor: pointer; font-family: inherit; margin-bottom: -1px; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .status-line { font-size: 12px; min-height: 18px; margin: 0 0 8px; color: var(--accent); }
  .status-line.err { color: var(--danger); }

  .new-btn { border: none; background: var(--accent); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; margin-bottom: 12px; }
  .new-form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .new-form .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .new-form .row .field { flex: 1; min-width: 180px; }
  .new-form select, .new-form input[type="date"], .inline-form select, .inline-form input[type="date"] { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--ink); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .form-actions button { font-size: 13px; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .form-actions .ok { border: none; background: var(--accent); color: #fff; }
  .form-actions .cancel { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .form-error { font-size: 12px; color: var(--danger); min-height: 16px; margin: 6px 0 0; }

  details.section { margin-bottom: 14px; }
  details.section > summary { font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; padding: 6px 0; list-style: none; }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary::before { content: '▸ '; }
  details.section[open] > summary::before { content: '▾ '; }
  .section-hint { font-size: 11.5px; color: var(--ink-soft); margin: 0 0 8px; }

  .task-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .task-card.review { border-color: var(--accent); }
  .task-card.done { background: #f7f6f2; }
  .task-head { display: flex; gap: 8px; align-items: flex-start; }
  .toggle { background: none; border: none; font-size: 13px; color: var(--ink-soft); cursor: pointer; padding: 2px 4px; line-height: 1.4; transition: transform 0.15s; }
  .toggle.open { transform: rotate(90deg); }
  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 14.5px; font-weight: 500; margin: 0; line-height: 1.5; word-break: break-word; }
  .task-meta { font-size: 12px; color: var(--ink-soft); margin: 3px 0 0; line-height: 1.6; }
  .task-desc { font-size: 13px; margin: 8px 0 0; white-space: pre-wrap; line-height: 1.6; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; font-weight: 400; }
  .tag.review { background: var(--accent-soft); color: var(--accent); }
  .tag.overdue { background: var(--danger-soft); color: var(--danger); }
  .tag.muted { background: #e8e5de; color: var(--ink-soft); }

  .task-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .task-actions button { font-size: 12.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-family: inherit; }
  .task-actions button.main { border-color: var(--accent); background: var(--accent); color: #fff; }
  .task-actions button:disabled { opacity: 0.45; cursor: not-allowed; }
  .task-actions .waiting { font-size: 12px; color: var(--ink-soft); align-self: center; }

  .inline-form { background: #f3f1ec; border-radius: 10px; padding: 10px; margin-top: 10px; }
  .inline-form .field { margin-bottom: 8px; }
  .inline-form textarea { min-height: 56px; font-size: 14px; }

  .task-log { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .log-item { font-size: 12.5px; padding: 5px 0; line-height: 1.6; }
  .log-item + .log-item { border-top: 1px solid #efece5; }
  .log-date { color: var(--ink-soft); font-size: 11.5px; }
  .log-kind { font-size: 11px; color: var(--accent); margin-left: 4px; }
  .log-note { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>待辦事項</h1>
        <p id="staffLine">—</p>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab-btn" data-tab="dispatched" id="tabDispatched" style="display:none;">我派發的任務</button>
      <button class="tab-btn" data-tab="mine" id="tabMine">我的任務</button>
    </div>

    <p class="status-line" id="statusLine"></p>

    <!-- 派發新任務（只有副理以上、而且在「我派發的任務」分頁才會出現） -->
    <div id="newWrap" style="display:none;">
      <button class="new-btn" id="newBtn">＋ 派發新任務</button>
      <form class="new-form" id="newForm" style="display:none;">
        <div class="field"><label for="nTitle">任務名稱</label><input type="text" id="nTitle" maxlength="200" placeholder="例如：更新公區防颱準備"></div>
        <div class="field"><label for="nDesc">說明（選填）</label><textarea id="nDesc" placeholder="要做什麼、做到什麼程度算完成"></textarea></div>
        <div class="row">
          <div class="field"><label for="nAssignee">執行人</label><select id="nAssignee"></select></div>
          <div class="field"><label for="nDue">預計完成日（選填）</label><input type="date" id="nDue"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="cancel" id="newCancel">取消</button>
          <button type="submit" class="ok">派發任務</button>
        </div>
        <p class="form-error" id="newError"></p>
      </form>
    </div>

    <div id="board"><p class="empty-state">載入中…</p></div>
  </div>

  <script src="config.js"></script>
  <script src="todos.js"></script>
<script src="sidebar.js"></script></body>
</html>
