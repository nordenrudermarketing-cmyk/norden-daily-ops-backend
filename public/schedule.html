<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排班表 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 100%; padding: 20px; }
  .top-controls { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .top-controls .field { margin-bottom: 0; }
  .top-controls input { width: 90px; }
  .legend { font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.sched { border-collapse: collapse; font-size: 12px; white-space: nowrap; }
  table.sched th, table.sched td { border: 1px solid var(--line); padding: 3px; text-align: center; }
  table.sched th.name-col, table.sched td.name-col { position: sticky; left: 0; background: var(--surface); z-index: 2; text-align: left; padding-left: 8px; min-width: 90px; }
  table.sched th { background: var(--accent-soft); font-weight: 500; }
  table.sched th.blackout, table.sched td.blackout-col { background: #f8e9e4; }
  table.sched th.day-btn { cursor: pointer; }
  table.sched td select { width: 46px; font-size: 12px; padding: 2px; border: none; background: transparent; text-align: center; }
  table.sched tr.group-row td { background: var(--accent-soft); font-weight: 600; text-align: left; padding-left: 8px; }
  td.off-total { font-weight: 600; }
  td.off-total.mismatch { color: var(--danger); background: var(--danger-soft); }
  tr.summary-row td { background: #f3f1ea; font-weight: 500; }
  tr.summary-row td.low { color: var(--danger); background: var(--danger-soft); }
  tr.lead-row td { background: #fff6e0; font-weight: 500; }
  tr.lead-row select { width: 60px; font-size: 12px; padding: 2px; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>排班表</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="dashboard.html">回總覽</a>
    </div>

    <div style="margin-bottom:12px;">
      <a href="schedule-import.html" style="font-size:12px;color:var(--accent);">從 Excel 匯入班表 →</a>
    </div>

    <div class="top-controls">
      <div class="field"><label for="monthInput">月份</label><input type="month" id="monthInput"></div>
      <div class="field"><label for="targetOff">休假天數目標</label><input type="text" id="targetOff" inputmode="numeric"></div>
      <div class="field"><label for="minFrontdesk">客務每日最低人數</label><input type="text" id="minFrontdesk" inputmode="numeric"></div>
      <div class="field"><label for="minHousekeeping">房務每日最低人數</label><input type="text" id="minHousekeeping" inputmode="numeric"></div>
      <button class="primary" id="saveBtn" style="width:auto;padding:10px 20px;">儲存排班表</button>
    </div>

    <p class="legend">
      班別代碼：A=07:00-15:30／B=14:30-23:00／C=11:00-19:30／房=房務值班／中・昼=09:00-17:30／特=特休／1=休假／PT1・PT2=兼職／管=管理
      　點日期欄位標題可以切換「禁休日」（粉色）
    </p>

    <div class="table-wrap">
      <table class="sched" id="schedTable"></table>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
