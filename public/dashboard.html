<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>營運總覽 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 960px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .metric-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .metric-label { font-size: 12px; color: var(--ink-soft); }
  .metric-value { font-size: 28px; font-weight: 600; margin-top: 4px; }
  .section-title { font-size: 15px; font-weight: 600; margin: 24px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-soft); font-weight: 500; background: var(--accent-soft); }
  tr:last-child td { border-bottom: none; }
  .miss { color: var(--danger); }
  .progress-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; background: var(--accent); }
  .anomaly-banner { background: var(--danger-soft); border: 1px solid #e3bfae; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .anomaly-banner .anomaly-title { font-size: 13px; font-weight: 600; color: var(--danger); margin: 0 0 8px; }
  .anomaly-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #e3bfae; }
  .anomaly-row:first-of-type { border-top: none; }
  .anomaly-row p { margin: 0; font-size: 13px; }
  .anomaly-row button { flex-shrink: 0; font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid #e3bfae; background: #fff; cursor: pointer; }
  .hq-banner { background: var(--accent-soft); border: 1px solid #b9d3c5; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .hq-banner .hq-title { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 8px; }
  .hq-row { padding: 8px 0; border-top: 1px solid #b9d3c5; }
  .hq-row:first-of-type { border-top: none; }
  .hq-row p.t { margin: 0; font-size: 13px; font-weight: 600; }
  .hq-row p.d { margin: 2px 0 6px; font-size: 12px; color: var(--ink-soft); }
  .hq-row .row-actions { display: flex; gap: 6px; }
  .hq-row input[type="text"] { flex: 1; font-size: 12px; padding: 6px; }
  .hq-row button { font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>營運總覽</h1>
        <p id="staffLine">—</p>
      </div>
      <button class="logout-link" id="logoutBtn">登出</button>
    </div>

    <div class="field" style="max-width:200px;">
      <label for="viewDate">查看日期</label>
      <input type="text" id="viewDate">
    </div>

    <div id="anomalyAlert"></div>
    <div id="hqTaskAlert"></div>

    <div style="margin-bottom:16px;">
      <a href="manager-checklist.html" style="font-size:12px;color:var(--accent);">每日巡館清單 →</a>
      &nbsp;&nbsp;
      <a href="schedule.html" style="font-size:12px;color:var(--accent);">排班表 →</a>
      &nbsp;&nbsp;
      <a href="templates.html" style="font-size:12px;color:var(--accent);">客務任務範本管理 →</a>
      &nbsp;&nbsp;
      <a href="issues.html" style="font-size:12px;color:var(--accent);">異常處理 →</a>
      &nbsp;&nbsp;
      <a href="learning-map.html" style="font-size:12px;color:var(--accent);">新人學習地圖 →</a>
    </div>

    <div class="grid-3">
      <div class="metric-card">
        <div class="metric-label">今日完成房數</div>
        <div class="metric-value" id="mRooms">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">有缺失房數</div>
        <div class="metric-value" id="mDefects">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">本月細清進度</div>
        <div class="metric-value" id="mDeepClean">—</div>
      </div>
    </div>

    <div class="section-title">房務業績獎金</div>
    <p style="font-size:11px;color:var(--ink-soft);margin:-8px 0 8px;">只計算客務已經巡房確認過的房間，還沒確認的暫不列入</p>
    <table id="bonusTable">
      <thead><tr><th>姓名</th><th>完成間數</th><th>缺失</th><th>淨間數</th><th>達標</th><th>獎金</th></tr></thead>
      <tbody></tbody>
    </table>

    <div class="section-title">未處理缺失</div>
    <table id="defectTable">
      <thead><tr><th>來源</th><th>說明</th><th>回報人</th><th>回報時間</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
