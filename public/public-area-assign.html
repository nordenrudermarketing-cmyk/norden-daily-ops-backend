<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公區任務分配 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cycle-title { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: 16px 0 8px; }
  .assign-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .assign-row .name { flex: 1; font-size: 13px; }
  .assign-row select { padding: 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; width: 140px; }
  .assign-row.done { opacity: 0.55; }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div>
        <h1>公區任務分配</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="checklist.html">回打卡頁</a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="today">今日公區</button>
      <button class="tab-btn" data-tab="month">本月／本季公區</button>
    </div>

    <div id="todayList"></div>
    <div id="monthList" style="display:none;"></div>

    <button class="primary" id="saveBtn" style="margin-top:16px;">儲存分配</button>
  </div>

  <script src="config.js"></script>
  <script src="public-area-assign.js"></script>
<script src="sidebar.js"></script></body>
</html>
