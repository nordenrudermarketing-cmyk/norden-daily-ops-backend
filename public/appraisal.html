<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每月評核 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .banner { background: var(--accent-soft); color: var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .banner.warn { background: #fff6e0; color: #8a6d00; }
  .banner.muted { background: #efece5; color: var(--ink-soft); }
  .progress-line { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
  .progress-line b { color: var(--ink); }
  .sec-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 18px 0 8px; display: flex; align-items: baseline; gap: 6px; }
  .sec-title small { font-weight: 400; font-size: 11.5px; }
  .sec-hint { font-size: 11.5px; color: var(--ink-soft); margin: -4px 0 8px; line-height: 1.6; }
  details.group > summary { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 8px; cursor: pointer; }

  .person { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
  .person.open { border-color: var(--accent); }
  .person-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: none; border: none; text-align: left; cursor: pointer; font-family: inherit; color: var(--ink); }
  .person-head .who { flex: 1; min-width: 0; }
  .person-head .name { font-size: 15px; font-weight: 500; }
  .person-head .meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: #efece5; color: var(--ink-soft); margin-left: 4px; font-weight: 400; }
  .st { font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .st.done { background: var(--accent-soft); color: var(--accent); }
  .st.todo { background: var(--danger-soft); color: var(--danger); }
  .st.opt { background: #efece5; color: var(--ink-soft); }

  .person-body { padding: 0 14px 14px; border-top: 1px dashed var(--line); }
  .relation { font-size: 11.5px; color: var(--ink-soft); margin: 10px 0 0; }
  .self-eval-btn { margin-top: 10px; font-size: 12.5px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; font-family: inherit; }
  .self-eval { margin-top: 10px; background: #faf8f4; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.6; }
  .self-eval h4 { margin: 0 0 6px; font-size: 13px; }
  .self-eval .qa { padding: 6px 0; border-top: 1px solid var(--line); }
  .self-eval .qa:first-of-type { border-top: none; }
  .self-eval .q { color: var(--ink); }
  .self-eval .a { color: var(--ink-soft); }
  .self-eval .a.no { color: var(--danger); }
  .self-eval .notes { white-space: pre-wrap; margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); }

  .item { margin-top: 14px; }
  .item-name { font-size: 14px; font-weight: 600; }
  details.desc { font-size: 12px; margin-top: 4px; }
  details.desc summary { color: var(--accent); cursor: pointer; }
  details.desc p { white-space: pre-line; margin: 6px 0 0; line-height: 1.65; color: var(--ink); }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .grades label { display: block; }
  .grades input { position: absolute; opacity: 0; pointer-events: none; }
  .grades span { display: flex; flex-direction: column; align-items: center; padding: 8px 0; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 17px; font-weight: 600; background: var(--surface); }
  .grades span small { font-size: 10.5px; font-weight: 400; color: var(--ink-soft); }
  .grades input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grades input:checked + span small { color: rgba(255, 255, 255, 0.85); }
  .grades input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grades input:disabled + span { cursor: default; }
  .comment-label { font-size: 12px; color: var(--ink-soft); margin: 14px 0 6px; display: block; }
  .save-msg { font-size: 12px; min-height: 16px; margin: 6px 0 0; }
  .save-msg.err { color: var(--danger); }
  .save-msg.ok { color: var(--accent); }

  .feedback-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 8px; }
  .feedback-box p.hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div>
        <h1>每月評核</h1>
        <p id="staffLine">—</p>
      </div>
    </div>

    <div id="windowBanner"></div>
    <p class="progress-line" id="progressLine"></p>
    <p class="error-msg" id="statusLine" style="min-height:0;"></p>
    <div id="list"><p class="empty-state">載入中…</p></div>
    <div id="feedbackArea"></div>
  </div>

  <script src="config.js"></script>
  <script src="appraisal.js"></script>
<script src="sidebar.js"></script></body>
</html>
