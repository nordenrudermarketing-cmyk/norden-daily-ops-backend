<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的學習地圖 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 760px; }
  .progress-summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
  .progress-summary .big { font-size: 24px; font-weight: 600; color: var(--accent); }
  .unit-group-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 18px 0 8px; }
  .unit-topic-title { font-size: 12px; color: var(--accent); margin: 14px 0 4px; }
  .unit-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .unit-row.pass { border-color: #b9d3c5; background: var(--accent-soft); }
  .unit-row.fail { border-color: #e3bfae; background: var(--danger-soft); }
  .unit-row.pending-assign { opacity: 0.6; }
  .unit-name { font-size: 13px; margin: 0; }
  .unit-status { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .stage-stepper { display: flex; gap: 8px; margin-bottom: 14px; }
  .stage-pill { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
  .stage-pill.pass { background: var(--accent-soft); border-color: #b9d3c5; }
  .stage-pill .stage-status { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>我的學習地圖</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="index.html">回登入</a>
    </div>

    <div class="progress-summary" id="progressSummary" style="display:none;">
      <div class="big" id="progressBig">0%</div>
      <div>
        <p style="margin:0;font-size:13px;">已合格 <span id="progressPass">0</span> / <span id="progressTotal">0</span> 項</p>
      </div>
    </div>

    <div id="unitsList"></div>

    <div class="unit-group-title" id="stageTitle" style="display:none;">四階段考核</div>
    <div class="stage-stepper" id="stageStepper"></div>
  </div>

  <script src="config.js"></script>
  <script src="learning-map.js"></script>
<script src="sidebar.js"></script></body>
</html>
