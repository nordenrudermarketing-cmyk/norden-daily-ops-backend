<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>獎金基數 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 860px; }
  .intro { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 12px; }
  .status-line { font-size: 12px; min-height: 18px; margin: 0 0 8px; color: var(--accent); }
  .status-line.err { color: var(--danger); }
  .sec-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin: 18px 0 8px; }
  .person { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
  .person-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .person-head .name { font-size: 14px; font-weight: 500; }
  .person-head .meta { font-size: 11.5px; color: var(--ink-soft); flex: 1; }
  .bases { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; align-items: flex-end; }
  .base { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-soft); }
  .base input { width: 92px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; font-variant-numeric: tabular-nums; }
  .base input.custom { border-color: var(--accent); background: var(--accent-soft); }
  .small-btn { font-size: 12px; padding: 7px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; }
  .small-btn.ghost { background: transparent; color: var(--accent); border: 1px dashed var(--accent); }
  .base .personal { display: flex; align-items: center; gap: 4px; }
  .base .tag { font-size: 10.5px; padding: 0 6px; border-radius: 6px; background: #fff6e0; color: #8a6d00; }
  .base .edit-link { font-size: 11px; color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; font-family: inherit; }
  dialog { border: none; border-radius: 14px; padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  dialog form { padding: 18px 18px 14px; }
  dialog h3 { margin: 0 0 12px; font-size: 16px; }
  .form-field { margin-bottom: 12px; }
  .form-field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--surface); color: var(--ink); }
  .form-field textarea { min-height: 70px; resize: vertical; }
  .form-field .hint { font-size: 11.5px; color: var(--ink-soft); margin: 4px 0 0; line-height: 1.5; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .dialog-actions .left { margin-right: auto; }
  .dialog-actions button { width: auto; flex: none; margin: 0; font-size: 13px; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .dialog-actions button.primary { border: none; background: var(--accent); color: #fff; }
  .dialog-actions button.danger { color: var(--danger); border-color: #e3bfae; }
  .dialog-error { font-size: 12px; color: var(--danger); min-height: 16px; margin: 0; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>獎金基數</h1>
        <p id="staffLine">—</p>
      </div>
    </div>
    <p class="intro">
      每位同仁每個評核項目的獎金基數（每 1 分多少元）。當月獎金＝各項目分數 × 基數再加總，項目分數未滿 60 分，這一項沒有獎金。<br>
      欄位留空＝用預設值（評核項目設定裡的預設基數；兼職、實習生預設 $0）。有特別設定的會用綠色標示。<br>
      某位同仁多一個評核項目（有對應的獎金）時，按他底下的「＋ 新增個人項目」，只有他會被評這一項。
    </p>
    <p class="status-line" id="statusLine"></p>
    <div id="list"><p class="empty-state">載入中…</p></div>
  </div>

  <!-- 新增／編輯個人項目 -->
  <dialog id="itemDialog">
    <form id="itemForm">
      <h3 id="itemTitle">新增個人項目</h3>
      <div class="form-field">
        <label for="pName">項目名稱</label>
        <input type="text" id="pName" required>
      </div>
      <div class="form-field">
        <label for="pSource">誰來評</label>
        <select id="pSource"></select>
        <p class="hint" id="pSourceHint"></p>
      </div>
      <div class="form-field">
        <label for="pBase">獎金基數（每 1 分多少元）</label>
        <input type="number" id="pBase" min="0" step="1" value="0">
      </div>
      <div class="form-field">
        <label for="pDesc">這一項評什麼（選填，評分的人會看到）</label>
        <textarea id="pDesc"></textarea>
      </div>
      <p class="dialog-error" id="itemError"></p>
      <div class="dialog-actions">
        <button type="button" class="danger left" id="pRemove" style="display:none;">移除這個項目</button>
        <button type="button" id="pCancel">取消</button>
        <button type="submit" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="appraisal-bases.js"></script>
<script src="sidebar.js"></script></body>
</html>
