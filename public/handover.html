<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交班表 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .num-row { display: flex; gap: 8px; }
  .num-row .field { flex: 1; }
  .custom-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 10px; }
  .custom-row .field { flex: 1; margin-bottom: 0; }
  .remove-btn { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .add-field-btn { font-size: 13px; color: var(--accent); background: none; border: 1px dashed var(--border-accent, var(--accent)); border-radius: 8px; padding: 8px; width: 100%; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div>
        <h1>交班表</h1>
        <p id="dateLine">—</p>
      </div>
      <a class="logout-link" href="shift.html">回任務頁</a>
    </div>

    <div class="field">
      <label for="shiftCode">交班班別</label>
      <select id="shiftCode"><option value="A">A班</option><option value="B">B班</option><option value="C">C班</option></select>
    </div>

    <div class="field"><label for="handoverStaff">交班人員</label><input type="text" id="handoverStaff" placeholder="例如：婕瑜、榆芳"></div>
    <div class="field"><label for="nextShiftStaff">接班確認人員</label><input type="text" id="nextShiftStaff"></div>

    <div class="num-row">
      <div class="field"><label for="checkinCount">本日入住</label><input type="text" id="checkinCount" inputmode="numeric"></div>
      <div class="field"><label for="checkoutExpected">明日預退</label><input type="text" id="checkoutExpected" inputmode="numeric"></div>
    </div>
    <div class="field"><label for="lateCheckin">晚入住房號</label><input type="text" id="lateCheckin" placeholder="例如：804D、1205"></div>

    <div class="field"><label for="billingNote">異常帳務說明</label><textarea id="billingNote"></textarea></div>
    <div class="field"><label for="cardCheck">總卡點交</label><input type="text" id="cardCheck" placeholder="例如：8/8"></div>
    <div class="field"><label for="pendingItems">交付之處理事項</label><textarea id="pendingItems"></textarea></div>

    <div class="field">
      <label for="facilityNote">公區、客房設備異常回報（已自動帶入今日任務回報，可編輯）</label>
      <textarea id="facilityNote" style="min-height:100px;"></textarea>
    </div>

    <div class="field"><label for="complaintNote">客訴/突發狀況</label><textarea id="complaintNote"></textarea></div>

    <div class="num-row">
      <div class="field"><label for="cashTotal">現金總額</label><input type="text" id="cashTotal" inputmode="numeric"></div>
      <div class="field"><label for="receiptTotal">憑證總額</label><input type="text" id="receiptTotal" inputmode="numeric"></div>
    </div>

    <div class="field">
      <label>自訂欄位</label>
      <div id="customFields"></div>
      <button type="button" class="add-field-btn" id="addFieldBtn">＋ 新增欄位</button>
    </div>

    <button class="primary" id="submitBtn" style="margin-top:16px;">送出交班表</button>
    <p class="error-msg" id="statusMsg"></p>
  </div>

  <script src="config.js"></script>
  <script src="handover.js"></script>
<script src="sidebar.js"></script></body>
</html>
