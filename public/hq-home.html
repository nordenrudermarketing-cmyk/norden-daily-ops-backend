<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; margin: 0; }
  .shell { display: flex; height: 100vh; background: var(--bg, #f5f4f0); }

  .sidebar { width: 76px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 16px 0; flex-shrink: 0; }
  .sidebar .logo { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 20px; text-align: center; line-height: 1.3; }
  .cat-btn { width: 52px; height: 52px; border-radius: 14px; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; margin-bottom: 8px; color: var(--ink-soft); }
  .cat-btn svg { width: 22px; height: 22px; }
  .cat-btn span { font-size: 9.5px; }
  .cat-btn.active { background: var(--accent-soft); color: var(--accent); }
  .cat-btn:hover:not(.active) { background: var(--surface-1); }

  .submenu { width: 190px; background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; flex-shrink: 0; overflow-y: auto; }
  .submenu h3 { font-size: 12px; color: var(--ink-soft); margin: 0 0 10px; font-weight: 600; }
  .submenu-item { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; border: none; background: transparent; font-size: 13px; color: var(--ink); cursor: pointer; margin-bottom: 4px; }
  .submenu-item.active { background: var(--accent); color: #fff; }
  .submenu-item:hover:not(.active) { background: var(--surface-1); }

  .content { flex: 1; overflow: hidden; }
  .content iframe { width: 100%; height: 100%; border: none; }

  .user-foot { margin-top: auto; text-align: center; font-size: 10px; color: var(--ink-soft); padding-top: 12px; }
</style>
</head>
<body>
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="logo">路得<br>行旅</div>
      <!-- 分類按鈕由 JS 動態產生 -->
      <div id="catButtons"></div>
      <div class="user-foot" id="userFoot"></div>
    </div>

    <div class="submenu" id="submenu" style="display:none;">
      <h3 id="submenuTitle"></h3>
      <div id="submenuItems"></div>
    </div>

    <div class="content" style="display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;padding:40px;text-align:center;">
      從左側選單挑一個分類，再點選要前往的功能，會直接跳轉過去
    </div>
  </div>

  <script src="config.js"></script>
  <script src="hq-home.js"></script>
</body>
</html>
