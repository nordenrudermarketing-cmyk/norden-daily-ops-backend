<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帳號管理 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 880px; }
  .intro { font-size: 12px; color: var(--ink-soft); line-height: 1.7; margin: 0 0 6px; }
  .scope-line { font-size: 12px; color: var(--accent); margin: 0 0 16px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type="search"], .toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-family: inherit; background: var(--surface); color: var(--ink); }
  .toolbar input[type="search"] { flex: 1; min-width: 180px; }
  .toolbar label { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .add-btn { margin-left: auto; padding: 8px 14px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }

  .status-line { font-size: 12px; min-height: 18px; margin: 0 0 8px; color: var(--accent); }
  .status-line.err { color: var(--danger); }

  .acct-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
  .acct-row.inactive { background: #f3f1ec; }
  .acct-row.inactive .acct-name { color: var(--ink-soft); }
  .acct-name { font-size: 14px; margin: 0; }
  .acct-meta { font-size: 11.5px; color: var(--ink-soft); margin: 3px 0 0; }
  .badge { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; }
  .badge.ok { background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--danger-soft); color: var(--danger); }
  .badge.muted { background: #e8e5de; color: var(--ink-soft); }
  .acct-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .acct-actions button { font-size: 12px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-family: inherit; color: var(--ink); }
  .acct-actions button.danger { color: var(--danger); border-color: #e3bfae; }

  dialog { border: none; border-radius: 14px; padding: 20px; width: min(420px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.18); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
  dialog h2 { font-size: 16px; margin: 0 0 14px; }
  .form-field { margin-bottom: 12px; }
  .form-field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .form-field input[type="text"], .form-field input[type="password"], .form-field select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: inherit; }
  .hint { font-size: 11px; color: var(--ink-soft); margin: 4px 0 0; line-height: 1.5; }
  .check-field { font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; cursor: pointer; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .dialog-actions button { padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .dialog-actions .cancel { border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .dialog-actions .save { border: none; background: var(--accent); color: #fff; }
  .dialog-error { font-size: 12px; color: var(--danger); min-height: 16px; margin: 4px 0 0; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>帳號管理</h1>
        <p id="staffLine">—</p>
      </div>
    </div>

    <p class="intro">
      密碼是加密儲存的，<strong>任何人（包含總公司）都沒辦法查看原本的密碼</strong>。
      同仁忘記密碼時，可以「設定密碼」直接給一組新的並告訴對方，或「清空密碼」讓對方下次登入時自己設定。
      不再使用的帳號請「停用」，停用後無法登入，但自評表等紀錄都會保留。
    </p>
    <p class="scope-line" id="scopeLine"></p>

    <div class="toolbar">
      <input type="search" id="search" placeholder="搜尋姓名或登入代碼">
      <select id="branchFilter" style="display:none;"></select>
      <label><input type="checkbox" id="showInactive"> 顯示已停用（<span id="inactiveCount">0</span>）</label>
      <button class="add-btn" id="addBtn">＋ 新增帳號</button>
    </div>

    <p class="status-line" id="statusLine"></p>
    <div id="list"></div>
  </div>

  <dialog id="editDialog">
    <form id="editForm">
      <h2 id="editTitle">新增帳號</h2>
      <div class="form-field">
        <label for="fName">姓名</label>
        <input type="text" id="fName" autocomplete="off">
      </div>
      <div class="form-field">
        <label for="fLoginCode">登入代碼</label>
        <input type="text" id="fLoginCode" autocomplete="off">
        <p class="hint">同仁登入時輸入的代碼，通常是員編，不能跟別人重複。</p>
      </div>
      <div class="form-field" id="fBranchField">
        <label for="fBranch">館別</label>
        <select id="fBranch"></select>
      </div>
      <div class="form-field">
        <label for="fRole">職務</label>
        <select id="fRole"></select>
        <p class="hint" id="fRoleHint" style="display:none;">不能修改自己的職務。</p>
      </div>
      <label class="check-field"><input type="checkbox" id="fPartTime"> 兼職（PT，不列入房務打掃獎金）</label>
      <div class="form-field" id="fPasswordField">
        <label for="fPassword">初始密碼（選填）</label>
        <input type="password" id="fPassword" autocomplete="new-password">
        <p class="hint">留空的話，同仁第一次登入時輸入的密碼會直接變成他的密碼。建議先設定好再告訴同仁，避免被別人搶先登入。</p>
      </div>
      <p class="dialog-error" id="editError"></p>
      <div class="dialog-actions">
        <button type="button" class="cancel" data-close>取消</button>
        <button type="submit" class="save">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="pwDialog">
    <form id="pwForm">
      <h2 id="pwTitle">設定新密碼</h2>
      <div class="form-field">
        <label for="pwInput">新密碼</label>
        <input type="password" id="pwInput" autocomplete="new-password">
      </div>
      <label class="check-field"><input type="checkbox" id="pwShow"> 顯示密碼</label>
      <p class="hint">設定後請直接告訴同仁，之後系統也查不到這組密碼。</p>
      <p class="dialog-error" id="pwError"></p>
      <div class="dialog-actions">
        <button type="button" class="cancel" data-close>取消</button>
        <button type="submit" class="save">設定</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="manage-passwords.js"></script>
<script src="sidebar.js"></script></body>
</html>
