<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密碼管理 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 800px; }
  .staff-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
  .staff-row .info { font-size: 13px; }
  .staff-row .meta { font-size: 11.5px; color: var(--ink-soft); }
  .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 8px; margin-right: 10px; }
  .status-badge.set { background: var(--accent-soft); color: var(--accent); }
  .status-badge.unset { background: var(--danger-soft); color: var(--danger); }
  .row-right { display: flex; align-items: center; }
  .reset-btn { font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>密碼管理</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" id="backLink" href="dashboard.html">回總覽</a>
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">
      密碼本身無法查看（加密後無法還原），如果同仁忘記密碼，點「重設」即可，對方下次登入
      會自動跳回「設定密碼」畫面，不需要知道原本的密碼。
    </p>
    <div id="list"></div>
  </div>

  <script src="config.js"></script>
  <script src="manage-passwords.js"></script>
</body>
</html>
