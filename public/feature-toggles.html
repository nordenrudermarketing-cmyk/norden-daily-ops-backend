<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>功能開關 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 820px; }

  .mode-banner { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; }
  .mode-banner.all { background: var(--accent-soft); border: 1px solid #b9d3c5; color: var(--accent); }
  .mode-banner.self_eval_only { background: #fff6e0; border: 1px solid #f0d98c; color: #8a6d00; }
  .mode-banner.custom { background: var(--surface-1, #f1efe9); border: 1px solid var(--line); color: var(--ink-soft); }

  .preset-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .preset-btn { flex: 1; min-width: 200px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-family: inherit; color: var(--ink); }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn strong { display: block; font-size: 13.5px; margin-bottom: 3px; }
  .preset-btn span { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; }

  .group-title { font-size: 12px; color: var(--ink-soft); font-weight: 600; margin: 20px 0 8px; }

  .feature-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 6px; }
  .feature-row.off { background: #fbfaf8; }
  .feature-row .info { flex: 1; min-width: 0; }
  .feature-row .name { font-size: 13.5px; }
  .feature-row .desc { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.5; }
  .feature-row .pages { font-size: 10.5px; color: var(--ink-soft); margin-top: 4px; opacity: 0.85; word-break: break-all; }
  .lock-badge { font-size: 10.5px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 7px; margin-left: 6px; white-space: nowrap; }

  /* 開關 */
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: #cfccc3; border-radius: 26px; transition: background .15s; cursor: pointer; }
  .switch .track::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(20px); }
  .switch input:disabled + .track { opacity: 0.45; cursor: not-allowed; }

  .status-line { font-size: 12px; color: var(--ink-soft); min-height: 18px; margin: 10px 0 0; }
  .status-line.err { color: var(--danger); }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>功能開關</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="hq-dashboard.html">回總覽</a>
    </div>

    <p style="font-size:12px;color:var(--ink-soft);line-height:1.7;margin:0 0 16px;">
      這裡控制的是<strong>全公司所有館別、所有同仁</strong>看得到的功能。關掉之後，該功能不會出現在
      任何人的側邊選單，直接輸入網址也會被導回自評表，後端 API 同時會擋下來，所以不會有人繞得過去。
      設定即時生效，同仁重新整理頁面就會看到變化。
    </p>

    <div class="mode-banner custom" id="modeBanner">載入中…</div>

    <div class="preset-row">
      <button class="preset-btn" id="presetSelfEvalOnly">
        <strong>只開放自評表</strong>
        <span>一鍵關閉以下所有功能，全公司只剩每月自評表可以用（總公司後台不受影響）</span>
      </button>
      <button class="preset-btn" id="presetEnableAll">
        <strong>全部開啟</strong>
        <span>把下面所有功能都打開，回到系統原本的完整狀態</span>
      </button>
    </div>

    <p class="status-line" id="statusLine"></p>

    <div id="featureList"></div>
  </div>

  <script src="config.js"></script>
  <script src="feature-toggles.js"></script>
<script src="sidebar.js"></script></body>
</html>
