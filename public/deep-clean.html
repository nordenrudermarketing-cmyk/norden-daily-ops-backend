<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月細清排程 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<style>
  .wide-screen { max-width: 760px; }
  .owner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .owner-cell { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .owner-cell label { font-size: 11px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; background: var(--surface); color: var(--ink); }
  .week-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>本月細清排程</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="checklist.html">回打卡頁</a>
    </div>

    <div class="section-title" style="font-size:14px;font-weight:600;margin-bottom:8px;">各樓層樓主</div>
    <div class="owner-grid" id="ownerGrid"></div>

    <div class="section-title" style="font-size:14px;font-weight:600;margin:20px 0 8px;">各樓層排在第幾週</div>
    <div class="owner-grid" id="weekGrid"></div>

    <button class="primary" id="generateBtn" style="margin-bottom:20px;">產生本月任務（不會覆蓋已完成項目）</button>

    <div class="section-title" style="font-size:14px;font-weight:600;margin-bottom:8px;">本月任務清單</div>
    <div id="taskList"></div>
  </div>

  <script src="config.js"></script>
  <script src="deep-clean.js"></script>
<script src="sidebar.js"></script></body>
</html>
