<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日班別任務 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div id="selfEvalReminder"></div>
    <div id="teachingReminder"></div>
    <div class="topbar">
      <div>
        <h1>今日班別任務</h1>
        <p id="staffLine">—</p>
      </div>
      <button class="logout-link" id="logoutBtn">登出</button>
    </div>

    <div id="linkRow" style="margin-bottom:12px;"></div>
    <div style="margin-bottom:12px;">
      <a href="handover.html" id="handoverLink" style="font-size:12px;color:var(--accent);">填寫今日交班表 →</a>
      &nbsp;&nbsp;
      <a href="complaint-register.html" style="font-size:12px;color:var(--accent);">客訴登記 →</a>
      &nbsp;&nbsp;
      <a href="daily-frontdesk-log.html" style="font-size:12px;color:var(--accent);">客務每日日誌（掃單/評論/NO SHOW）→</a>
      &nbsp;&nbsp;
      <a href="staff-cleaning.html" style="font-size:12px;color:var(--accent);">個人清潔配額 →</a>
      &nbsp;&nbsp;
      <a href="routine-tasks.html" style="font-size:12px;color:var(--accent);">我的例行事項 →</a>
      &nbsp;&nbsp;
      <a href="learning-map.html" id="learningMapLink" style="font-size:12px;color:var(--accent);display:none;">我的學習地圖 →</a>
      &nbsp;&nbsp;
      <a href="my-teaching.html" style="font-size:12px;color:var(--accent);">我的教學任務 →</a>
      &nbsp;&nbsp;
      <a href="self-eval.html" style="font-size:12px;color:var(--accent);">每月自評表 →</a>
    </div>

    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">完成</div>
        <div class="summary-value" id="sumDone">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">剩餘</div>
        <div class="summary-value" id="sumRemaining">0</div>
      </div>
    </div>

    <div id="taskList"></div>
  </div>

  <div class="overlay" id="reportOverlay" style="display:none;">
    <div class="card">
      <p class="card-title" id="reportTaskTitle" style="margin-bottom:12px;">回報異常</p>
      <div class="field">
        <label for="reportNote">問題說明</label>
        <textarea id="reportNote" placeholder="例如：8樓廁所燈不亮"></textarea>
      </div>
      <div class="field">
        <label for="reportPhoto">照片（選填）</label>
        <input type="file" id="reportPhoto" accept="image/*" capture="environment">
      </div>
      <div class="action-row">
        <button class="secondary" id="reportCancel">取消</button>
        <button class="btn" id="reportSubmit">送出</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="self-eval-reminder.js"></script>
  <script src="homepage-reminders.js"></script>
  <script src="shift.js"></script>
</body>
</html>
