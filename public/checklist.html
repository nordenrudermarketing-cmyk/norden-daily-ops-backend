<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日房號 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div id="selfEvalReminder"></div>
    <div id="teachingReminder"></div>
    <div class="topbar">
      <div>
        <h1>今日房號</h1>
        <p id="staffLine">—</p>
      </div>
      <button class="logout-link" id="logoutBtn">登出</button>
    </div>

    <div style="margin-bottom:12px;">
      <a href="assign.html" id="assignLink" style="font-size:12px;color:var(--accent);display:none;">小隊長：今日房號分配 →</a>
      <span id="assignSep" style="display:none;">&nbsp;&nbsp;</span>
      <span id="maintenanceLinkSlot"></span>
      &nbsp;&nbsp;
      <a href="public-area.html" style="font-size:12px;color:var(--accent);">公區保養 →</a>
      <span id="paAssignSep" style="display:none;">&nbsp;&nbsp;</span>
      <a href="public-area-assign.html" id="paAssignLink" style="font-size:12px;color:var(--accent);display:none;">小隊長：公區任務分配 →</a>
      &nbsp;&nbsp;
      <a href="learning-map.html" id="learningMapLink" style="font-size:12px;color:var(--accent);display:none;">我的學習地圖 →</a>
      &nbsp;&nbsp;
      <a href="my-teaching.html" style="font-size:12px;color:var(--accent);">我的教學任務 →</a>
      &nbsp;&nbsp;
      <a href="self-eval.html" style="font-size:12px;color:var(--accent);">每月自評表 →</a>
      &nbsp;&nbsp;
      <a href="bonus-appeals.html" style="font-size:12px;color:var(--accent);">獎金申覆 →</a>
      &nbsp;&nbsp;
      <a href="adhoc-tasks.html" style="font-size:12px;color:var(--accent);">臨時任務 →</a>
    </div>

    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">完成間數</div>
        <div class="summary-value" id="sumDone">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">缺失</div>
        <div class="summary-value danger" id="sumDefect">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">剩餘</div>
        <div class="summary-value" id="sumRemaining">0</div>
      </div>
    </div>

    <div id="roomList"></div>
  </div>

  <script src="config.js"></script>
  <script src="self-eval-reminder.js"></script>
  <script src="homepage-reminders.js"></script>
  <script src="checklist.js"></script>
<script>
  // 如果是被左側選單外殼（housekeeping-home.html）包起來顯示的，
  // 就把頁面裡原本那排重複的橫向連結隱藏掉，避免跟側邊選單重複
  if (window.self !== window.top) {
    document.addEventListener('DOMContentLoaded', () => {
      const hrefsToHide = [
        'zone-maintenance.html', 'deep-clean.html', 'public-area.html',
        'my-teaching.html', 'self-eval.html', 'bonus-appeals.html', 'adhoc-tasks.html'
      ];
      hrefsToHide.forEach((href) => {
        document.querySelectorAll(`a[href="${href}"]`).forEach((a) => { a.style.display = 'none'; });
      });
    });
  }
</script>
</body>
</html>
