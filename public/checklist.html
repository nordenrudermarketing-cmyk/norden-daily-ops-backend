<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>今日房號 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div>
        <h1>今日房號</h1>
        <p id="staffLine">—</p>
      </div>
      <button class="logout-link" id="logoutBtn">登出</button>
    </div>

    <div style="margin-bottom:12px;">
      <a href="assign.html" style="font-size:12px;color:var(--accent);">小隊長：今日房號分配 →</a>
      &nbsp;&nbsp;
      <span id="maintenanceLinkSlot"></span>
      &nbsp;&nbsp;
      <a href="learning-map.html" style="font-size:12px;color:var(--accent);">新人學習地圖 →</a>
    </div>

    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">完成間數</div>
        <div class="summary-value" id="sumDone">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">缺失</div>
        <div class="summary-value danger" id="sumDefect">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">剩餘</div>
        <div class="summary-value" id="sumRemaining">0</div>
      </div>
    </div>

    <div id="roomList"></div>
  </div>

  <script src="config.js"></script>
  <script src="checklist.js"></script>
</body>
</html>
