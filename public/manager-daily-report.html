<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開班收班日報 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div>
        <h1>開班收班日報</h1>
        <p id="staffLine">—</p>
      </div>
      <a class="logout-link" href="dashboard.html">回總覽</a>
    </div>

    <div class="section-title" style="font-weight:600;margin-bottom:8px;">開班</div>
    <div class="field"><label for="plannedTasks">預計執行事項</label><textarea id="plannedTasks" style="min-height:80px;"></textarea></div>
    <button class="primary" id="openBtn">送出開班紀錄</button>
    <p id="openedInfo" style="font-size:12px;color:var(--ink-soft);margin-top:6px;"></p>

    <div class="section-title" style="font-weight:600;margin:24px 0 8px;">收班</div>
    <div class="field"><label for="completedItems">完成事項</label><textarea id="completedItems"></textarea></div>
    <div class="field"><label for="pendingItems">未完成待追蹤</label><textarea id="pendingItems"></textarea></div>
    <div class="field"><label for="spotChecks">各項抽檢</label><textarea id="spotChecks"></textarea></div>
    <div class="field"><label for="hqNotes">總公司反應事項</label><textarea id="hqNotes"></textarea></div>
    <button class="primary" id="closeBtn">送出收班紀錄</button>
    <p id="closedInfo" style="font-size:12px;color:var(--ink-soft);margin-top:6px;"></p>
  </div>

  <script src="config.js"></script>
  <script src="manager-daily-report.js"></script>
</body>
</html>
