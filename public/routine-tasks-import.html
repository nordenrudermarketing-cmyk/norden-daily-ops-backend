<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>匯入例行事項 | 路得行旅</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  .wide-screen { max-width: 900px; }
  .warn-box { background: var(--danger-soft); border: 1px solid #e3bfae; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--danger); }
  .ok-box { background: var(--accent-soft); border: 1px solid #b9d3c5; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 12.5px; color: var(--accent); }
  table.preview { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  table.preview th, table.preview td { border-bottom: 1px solid var(--line); padding: 6px 8px; font-size: 12px; text-align: left; }
  table.preview th { background: var(--accent-soft); font-weight: 500; }
</style>
</head>
<body>
  <div class="screen wide-screen">
    <div class="topbar">
      <div>
        <h1>匯入例行事項</h1>
        <p>格式：人員／類別／項目／進度／預計完成日／實際完成日／NOTE（跟你們現在用的整理格式一致）</p>
      </div>
      <a class="logout-link" href="routine-tasks-manage.html">回例行事項管理</a>
    </div>

    <div class="field"><label for="fileInput">選擇 Excel 或 CSV 檔案</label><input type="file" id="fileInput" accept=".xlsx,.xls,.csv"></div>
    <div class="field" style="max-width:200px;"><label for="yearMonthInput">這份檔案的年月（用來換算日期）</label><input type="month" id="yearMonthInput"></div>

    <div id="resultArea"></div>
  </div>

  <script src="config.js"></script>
  <script src="routine-tasks-import.js"></script>
<script src="sidebar.js"></script></body>
</html>
