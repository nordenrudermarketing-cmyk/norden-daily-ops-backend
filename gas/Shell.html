<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F7F5F0; }
  #page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; display: block; }
  #loading { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: #2F5D4F; z-index: 20;
             transform-origin: left; animation: loadbar 1.2s ease-in-out infinite; display: none; }
  @keyframes loadbar { 0% { transform: scaleX(0); } 60% { transform: scaleX(.8); } 100% { transform: scaleX(1); opacity: 0; } }
  #envBadge { position: fixed; right: 8px; bottom: 8px; z-index: 20; background: #b3462c; color: #fff;
              font: 12px/1.6 -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif; padding: 2px 10px;
              border-radius: 12px; opacity: .85; max-width: 75vw; cursor: pointer; user-select: none; }
  #fatal { position: fixed; inset: 0; z-index: 30; display: none; background: #F7F5F0; color: #23291F;
           font: 14px/1.8 -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif; padding: 60px 24px; text-align: center; }
  #fatal button { margin-top: 12px; padding: 8px 20px; border: 0; border-radius: 8px; background: #2F5D4F; color: #fff; font-size: 14px; }
</style>
</head>
<body>
<div id="loading"></div>
<? if (isStaging) { ?><div id="envBadge">測試站</div><? } ?>
<div id="fatal"><div id="fatalMsg"></div><button onclick="location.reload()">重新整理</button></div>
<iframe id="page" title="路得行旅 每日營運系統"></iframe>
<script>
  // ============================================================
  // 外框：整個系統只有這一個 Apps Script 網頁，各功能頁面載入到下面的內框（#page）裡。
  // 換頁時跟 Apps Script 要下一頁的 HTML，放進內框，網址列的 ?page= 也跟著改，
  // 所以重新整理、上一頁都還是停在對的頁面。
  // ============================================================
  var INITIAL = <?!= initialJson ?>;
  var frame = document.getElementById('page');
  var loading = document.getElementById('loading');

  function parseUrl(url) {
    var s = String(url || '').trim();
    var hash = s.indexOf('#');
    if (hash >= 0) s = s.slice(0, hash);
    var q = s.indexOf('?');
    var path = q >= 0 ? s.slice(0, q) : s;
    var query = {};
    if (q >= 0) new URLSearchParams(s.slice(q + 1)).forEach(function (v, k) { query[k] = v; });
    var page = path.split('/').pop().replace(/\.html$/i, '') || 'index';
    return { page: page, query: query };
  }

  function urlParams(target) {
    var params = { page: target.page };
    Object.keys(target.query || {}).forEach(function (k) { params[k] = target.query[k]; });
    return params;
  }

  // 測試站右下角顯示最近一次呼叫花多久，點一下展開最近幾次的明細（正式站不會顯示）
  var timings = [];
  var lastTotal = null;
  var timingOpen = false;
  function renderBadge() {
    var badge = document.getElementById('envBadge');
    if (!badge) return;
    var head = '測試站' + (lastTotal === null ? '' : ' · ' + (lastTotal / 1000).toFixed(1) + 's');
    badge.innerHTML = head + (timingOpen && timings.length
      ? '<div style="font-size:9px;line-height:1.4;text-align:left">' +
        timings.map(function (t) { return t.replace(/</g, '&lt;'); }).join('<br>') + '</div>'
      : '');
  }
  function showTiming(req, res, totalMs) {
    var s = res.stats || {};
    lastTotal = totalMs;
    timings.unshift(req.method + ' ' + req.path.replace('/api/', '') + '　總共 ' + (totalMs / 1000).toFixed(1) + 's' +
      '（伺服器 ' + ((res.ms || 0) / 1000).toFixed(1) + 's，讀表 ' + (s.reads || 0) + ' 次 ' + ((s.readMs || 0) / 1000).toFixed(1) + 's' +
      (s.writes ? '，寫入 ' + s.writes + ' 次 ' + (s.writeMs / 1000).toFixed(1) + 's' : '') + '）');
    timings = timings.slice(0, 5);
    renderBadge();
  }
  var envBadge = document.getElementById('envBadge');
  if (envBadge) envBadge.addEventListener('click', function () { timingOpen = !timingOpen; renderBadge(); });

  function showFatal(message) {
    document.getElementById('fatalMsg').textContent = '頁面載入失敗：' + message;
    document.getElementById('fatal').style.display = 'block';
  }

  // mode：'push' 新增一筆瀏覽紀錄、'replace' 取代目前這筆、'none' 不動（上一頁／下一頁時）
  function render(target, mode) {
    loading.style.display = 'block';
    var sentAt = Date.now();
    google.script.run
      .withSuccessHandler(function (html) {
        showTiming({ method: '頁面', path: target.page }, {}, Date.now() - sentAt);
        frame.srcdoc = html;
        if (mode === 'push') google.script.history.push(target, urlParams(target));
        if (mode === 'replace') google.script.history.replace(target, urlParams(target));
        loading.style.display = 'none';
      })
      .withFailureHandler(function (err) {
        loading.style.display = 'none';
        showFatal(err && err.message ? err.message : String(err));
      })
      .getPage(target.page);
  }

  // 給內框裡的轉接器（shim.js）用
  window.__app = {
    navigate: function (url, opts) {
      render(parseUrl(url), opts && opts.replace ? 'replace' : 'push');
    },
    api: function (req) {
      var sentAt = Date.now();
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (text) {
            var res = JSON.parse(text);
            showTiming(req, res, Date.now() - sentAt);
            resolve(res);
          })
          .withFailureHandler(function (err) {
            resolve({ status: 500, body: { error: '連線失敗，請稍後再試（' + (err && err.message ? err.message : err) + '）' } });
          })
          .api(JSON.stringify(req));
      });
    },
  };

  google.script.history.setChangeHandler(function (e) {
    var target = e.state && e.state.page ? e.state : { page: (e.location.parameter.page || 'index'), query: {} };
    render(target, 'none');
  });

  render(INITIAL, 'replace');
</script>
</body>
</html>
