<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>路得行旅 每日營運系統</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-screen">
    <div class="login-box">
      <h1>路得行旅</h1>
      <p>每日營運系統・請輸入登入代碼</p>
      <div class="field">
        <label for="loginCode">登入代碼</label>
        <input type="password" id="loginCode" inputmode="numeric" placeholder="輸入代碼" autocomplete="off">
      </div>
      <button class="primary" id="loginBtn">登入</button>
      <p class="error-msg" id="errorMsg"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
